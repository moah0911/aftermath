# Publishes @after.math/aftermath to the public npm registry when a release is
# published. Idempotent by design:
#   - if this version is already on npm, the publish is skipped (no E409)
#   - if no npm_token secret is configured, the publish is skipped (no ENEEDAUTH)
# Publishing from a local checkout (npm publish) remains the primary path.
#
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Check whether this version is already published
        id: guard
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm — nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for a publish token
        id: token
        if: steps.guard.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No npm_token secret configured — skipping npm publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.guard.outputs.skip == 'false' && steps.token.outputs.skip == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
